services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "${PUID:-999}:${PGID:-999}"
    environment:
      POSTGRES_USER: gigboy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gigboy
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigboy -d gigboy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/blindpassasjer/gigboy:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ATTACHMENTS_DIR: /data/attachments
      PORT: ${PORT:-6168}
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_PASSWORDS: ${AUTH_PASSWORDS:-true}
      AUTH_MAGIC_LINKS: ${AUTH_MAGIC_LINKS:-false}
      AUTH_PASSKEYS: ${AUTH_PASSKEYS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ULTIMATE_GUITAR_SEARCH: ${ULTIMATE_GUITAR_SEARCH:-true}
      ULTIMATE_GUITAR_MAX_REQUESTS_PER_HOUR: ${ULTIMATE_GUITAR_MAX_REQUESTS_PER_HOUR:-60}
    volumes:
      - ./data/attachments:/data/attachments
    ports:
      - "${PORT:-6168}:${PORT:-6168}"
